<svg xmlns="http://www.w3.org/2000/svg" width="854" height="96" viewBox="0 0 854 96"
     role="img" aria-label="Built in Sri Lanka — free tools, no signup, no paywall — induwara.lk">
  <title>Built in Sri Lanka — induwara.lk</title>
  
  <defs>
    <linearGradient id="ft-panel" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="ft-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.5" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="ft-sheen" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(-1 0)">
