    <text x="536" y="116" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">19.7%</text>
    <rect x="568" y="106" width="11" height="11" rx="3" fill="#A371F7"/>
    <text x="588" y="116" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#E8EEF9">HTML</text>
    <text x="804" y="116" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">14.4%</text>
    <rect x="32" y="142" width="11" height="11" rx="3" fill="#F0A93B"/>
    <text x="52" y="152" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#E8EEF9">JavaScript</text>
    <text x="268" y="152" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">9.9%</text>
    <rect x="300" y="142" width="11" height="11" rx="3" fill="#EC6A5E"/>
    <text x="320" y="152" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#E8EEF9">CSS</text>
    <text x="536" y="152" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">7.0%</text>
    <rect x="568" y="142" width="11" height="11" rx="3" fill="#2BB3B3"/>
    <text x="588" y="152" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#E8EEF9">Python</text>
    <text x="804" y="152" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">1.7%</text>
  <text x="32" y="192" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#6B7C99">Byte counts from the GitHub languages API, including older coursework repos — day-to-day work is the TypeScript slice.</text>
</svg>
