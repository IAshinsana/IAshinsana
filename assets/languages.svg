<svg xmlns="http://www.w3.org/2000/svg" width="854" height="208" viewBox="0 0 854 208"
     role="img" aria-label="Language mix across 11 own public repositories">
  <title>Language mix — 11 own public repos</title>
  
  <defs>
    <linearGradient id="lg-panel" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="0.5" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="lg-sheen" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(-1 0)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="lg-clip"><rect x="0" y="0" width="854" height="208" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="853" height="207" rx="15.5"
        fill="url(#lg-panel)" stroke="#1E293F"/>
  <g clip-path="url(#lg-clip)">
    <rect x="0" y="0" width="854" height="3" fill="url(#lg-accent)"/>
    <rect x="0" y="0" width="854" height="3" fill="url(#lg-sheen)"/>
  </g>
  
  <text x="32" y="38" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700"
        letter-spacing="1.9" fill="#6B7C99">LANGUAGE MIX — OWN PUBLIC REPOS</text><text x="822" y="38" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12"
             fill="#6B7C99">11 repos · forks excluded</text>
  <defs>
    <clipPath id="lg-bar"><rect x="32" y="58" width="790" height="20" rx="10"/></clipPath>
    <linearGradient id="lg-gloss" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(-1 0)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#lg-bar)">
    <rect x="32" y="58" width="373.3" height="20"
                       fill="#3FB950"><title>PHP 47.2%</title></rect><rect x="405.3" y="58" width="155.7" height="20"
                       fill="#2F81F7"><title>TypeScript 19.7%</title></rect><rect x="560.9" y="58" width="113.8" height="20"
                       fill="#A371F7"><title>HTML 14.4%</title></rect><rect x="674.7" y="58" width="78.3" height="20"
                       fill="#F0A93B"><title>JavaScript 9.9%</title></rect><rect x="753.1" y="58" width="55.3" height="20"
                       fill="#EC6A5E"><title>CSS 7%</title></rect><rect x="808.4" y="58" width="13.6" height="20"
                       fill="#2BB3B3"><title>Python 1.7%</title></rect>
    <rect x="32" y="58" width="790" height="20" fill="url(#lg-gloss)"/>
  </g>
  
    <rect x="32" y="106" width="11" height="11" rx="3" fill="#3FB950"/>
