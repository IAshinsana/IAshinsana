    <text x="268" y="116" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5"
          fill="#A3B1C9" style="font-variant-numeric:tabular-nums">47.2%</text>
    <rect x="300" y="106" width="11" height="11" rx="3" fill="#2F81F7"/>
